<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Cookie Checker</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; padding: 15px; margin: 0; }
        .container { max-width: 100%; margin: 0 auto; background: #1e1e1e; padding: 15px; border-radius: 8px; }
        h3 { margin-top: 0; color: #00a2ff; }
        textarea { width: 100%; height: 120px; background: #2b2b2b; color: #fff; border: 1px solid #444; border-radius: 5px; padding: 8px; box-sizing: border-box; font-family: monospace; font-size: 12px; }
        .btn-group { margin: 10px 0; display: flex; gap: 8px; flex-wrap: wrap; }
        button { background: #00a2ff; color: #fff; border: none; padding: 10px 14px; font-weight: bold; border-radius: 5px; cursor: pointer; flex: 1; min-width: 120px; }
        button.export-btn { background: #28a745; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
        .stat-card { background: #2b2b2b; padding: 8px; border-radius: 5px; text-align: center; font-size: 12px; }
        .stat-card span { display: block; font-size: 14px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        th, td { padding: 8px; border: 1px solid #333; text-align: left; }
        th { background: #252525; color: #00a2ff; }
        .badge-valid { color: #2ecc71; font-weight: bold; }
        .badge-invalid { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h3>Roblox Cookie Checker</h3>
    <textarea id="cookiesInput" placeholder="Tempel cookie di sini (1 cookie per baris)..."></textarea>
    
    <div class="btn-group">
        <button onclick="checkCookies()">Cek Cookie</button>
        <button class="export-btn" onclick="exportTXT()">Save .TXT</button>
        <button class="export-btn" onclick="exportJSON()">Save .JSON</button>
    </div>

    <div class="stats" id="statsContainer" style="display:none;">
        <div class="stat-card">Valid: <span id="statValid" style="color:#2ecc71;">0</span></div>
        <div class="stat-card">Robux: <span id="statRobux" style="color:#f1c40f;">0</span></div>
        <div class="stat-card">RAP: <span id="statRap" style="color:#9b59b6;">0</span></div>
    </div>

    <div id="statusText" style="margin: 8px 0; font-size: 13px;"></div>

    <table id="resultTable" style="display:none;">
        <thead>
            <tr>
                <th>Status</th>
                <th>User / ID</th>
                <th>Robux / RAP</th>
            </tr>
        </thead>
        <tbody id="resultBody"></tbody>
    </table>
</div>

<script>
    let lastResults = [];

    async function checkCookies() {
        const rawText = document.getElementById('cookiesInput').value;
        const cookies = rawText.split('\n').map(c => c.trim()).filter(c => c.length > 0);
        
        if (cookies.length === 0) return alert('Masukkan cookie dulu!');

        const statusText = document.getElementById('statusText');
        statusText.innerText = `Memproses ${cookies.length} cookie...`;

        try {
            const res = await fetch('/api/check-bulk', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cookies })
            });

            const data = await res.json();
            lastResults = data.results || [];
            renderResults(lastResults);
            statusText.innerText = `Selesai mengecek ${lastResults.length} akun.`;
        } catch (e) {
            statusText.innerText = 'Gagal terhubung ke backend.';
        }
    }

    function renderResults(results) {
        const tbody = document.getElementById('resultBody');
        tbody.innerHTML = '';

        let validCount = 0;
        let totalRobux = 0;
        let totalRap = 0;

        results.forEach(item => {
            const tr = document.createElement('tr');
            if (item.status === 'VALID') {
                validCount++;
                totalRobux += (typeof item.robux === 'number' ? item.robux : 0);
                totalRap += item.totalRap;

                tr.innerHTML = `
                    <td><span class="badge-valid">VALID</span></td>
                    <td><b>${item.username}</b><br><small style="color:#888;">ID: ${item.userId}</small></td>
                    <td>R$ ${item.robux.toLocaleString()}<br><small style="color:#9b59b6;">RAP: ${item.totalRap.toLocaleString()}</small></td>
                `;
            } else {
                tr.innerHTML = `
                    <td><span class="badge-invalid">FAIL</span></td>
                    <td colspan="2" style="color:#888;">${item.error}</td>
                `;
            }
            tbody.appendChild(tr);
        });

        document.getElementById('statValid').innerText = validCount;
        document.getElementById('statRobux').innerText = totalRobux.toLocaleString();
        document.getElementById('statRap').innerText = totalRap.toLocaleString();

        document.getElementById('statsContainer').style.display = 'grid';
        document.getElementById('resultTable').style.display = 'table';
    }

    function exportTXT() {
        if (lastResults.length === 0) return alert('Data kosong!');
        let textContent = "";
        lastResults.filter(r => r.status === 'VALID').forEach(item => {
            textContent += `Username: ${item.username} | Robux: ${item.robux} | RAP: ${item.totalRap}\nCookie: ${item.cookie}\n-----------------------------------\n`;
        });
        downloadFile(textContent, 'valid_accounts.txt', 'text/plain');
    }

    function exportJSON() {
        if (lastResults.length === 0) return alert('Data kosong!');
        const validOnly = lastResults.filter(r => r.status === 'VALID');
        downloadFile(JSON.stringify(validOnly, null, 2), 'valid_accounts.json', 'application/json');
    }

    function downloadFile(content, fileName, contentType) {
        const a = document.createElement("a");
        const file = new Blob([content], { type: contentType });
        a.href = URL.createObjectURL(file);
        a.download = fileName;
        a.click();
    }
</script>

</body>
                                                                   </html>
