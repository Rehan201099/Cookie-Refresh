<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Pro Cookie Checker - Economy</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-indigo-400 mb-2">Roblox Pro Cookie Checker</h1>
            <p class="text-slate-400">Cek akun lengkap dengan info Robux Masuk/Keluar & Riwayat Pengeluaran.</p>
        </header>

        <!-- Input Area -->
        <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 mb-6">
            <label class="block text-sm font-medium mb-2 text-slate-300">Masukkan Cookie (.ROBLOSECURITY):</label>
            <textarea id="cookieInput" rows="5" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 font-mono" placeholder="_|WARNING:-DO-NOT-SHARE-THIS..."></textarea>
            
            <div class="mt-4 flex flex-wrap gap-4 items-center justify-between">
                <button onclick="startChecking()" id="checkBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-6 py-2.5 rounded-lg transition duration-200 shadow-md">
                    Mulai Cek Akun
                </button>
                <div class="text-sm" id="statusText"></div>
            </div>
        </div>

        <!-- Filter & Search Bar -->
        <div class="mb-4 flex flex-col md:flex-row gap-4 justify-between items-center">
            <input type="text" id="searchInput" onkeyup="filterResults()" placeholder="Cari username..." class="w-full md:w-1/3 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
            <div class="text-sm text-slate-400" id="totalValid">Total Valid: 0</div>
        </div>

        <!-- Results Section -->
        <div class="bg-slate-800 rounded-xl shadow-lg border border-slate-700 overflow-hidden">
            <div class="p-4 border-b border-slate-700 font-semibold text-slate-300">Hasil Pengecekan Ekonomi Akun</div>
            <div id="resultsContainer" class="divide-y divide-slate-700 max-h-[600px] overflow-y-auto p-4 space-y-4">
                <p class="text-slate-500 text-center py-4">Belum ada data yang dicek.</p>
            </div>
        </div>
    </div>

    <script>
        let allResults = [];

        async function startChecking() {
            const input = document.getElementById('cookieInput').value;
            const cookies = input.split('\n').map(c => c.trim()).filter(c => c.length > 0);
            
            if (cookies.length === 0) {
                alert('Masukkan setidaknya satu cookie!');
                return;
            }

            const btn = document.getElementById('checkBtn');
            const statusText = document.getElementById('statusText');
            btn.disabled = true;
            btn.classList.add('opacity-50');
            statusText.className = "text-sm text-amber-400";
            statusText.innerText = `Memeriksa ${cookies.length} akun...`;

            try {
                const response = await fetch('/api/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cookies })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Gagal tersambung ke server');

                allResults = data.results || [];
                renderResults(allResults);

                statusText.className = "text-sm text-emerald-400 font-semibold";
                statusText.innerText = `Selesai! Ditemukan ${allResults.length} akun valid.`;
            } catch (err) {
                statusText.className = "text-sm text-rose-400 font-semibold";
                statusText.innerText = `Error: ${err.message}`;
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }

        function renderResults(data) {
            const container = document.getElementById('resultsContainer');
            document.getElementById('totalValid').innerText = `Total Valid: ${data.length}`;
            
            if (data.length === 0) {
                container.innerHTML = `<p class="text-slate-500 text-center py-4">Tidak ada akun valid yang ditemukan.</p>`;
                return;
            }

            container.innerHTML = data.map(acc => {
                let txHtml = acc.transactions && acc.transactions.length > 0 ? acc.transactions.map(tx => `
                    <div class="flex justify-between items-center bg-slate-800 p-2 rounded text-xs border border-slate-700">
                        <span class="text-slate-300 truncate max-w-[180px]">${tx.description}</span>
                        <span class="${tx.amount > 0 ? 'text-emerald-400 font-semibold' : 'text-rose-400 font-semibold'}">
                            ${tx.amount > 0 ? '+' + tx.amount : tx.amount} Robux
                        </span>
                    </div>
                `).join('') : '<span class="text-xs text-slate-500">Tidak ada riwayat transaksi terbaru.</span>';

                return `
                <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 space-y-4">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div class="flex items-center gap-4">
                            <div class="relative w-16 h-16 flex-shrink-0 bg-slate-800 rounded-full overflow-hidden border-2 border-indigo-500">
                                <img src="https://tr.rbxcdn.com/30df39a38f38d38a8e10c73229b110bc/150/150/AvatarHeadshot/Png" 
                                     onload="fetchAvatar(this, ${acc.userId})" alt="Avatar" class="w-full h-full object-cover">
                            </div>
                            <div>
                                <div class="flex items-center gap-2 flex-wrap">
                                    <span class="font-bold text-indigo-400 text-lg">${acc.username}</span>
                                    <span class="text-xs bg-slate-800 px-2 py-0.5 rounded text-slate-300">ID: ${acc.userId}</span>
                                    ${acc.isPremium ? '<span class="text-xs bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded font-semibold">Premium</span>' : ''}
                                </div>
                                <div class="text-sm text-slate-400 mt-1 flex flex-wrap gap-4">
                                    <span>💰 Saldo: <strong class="text-emerald-400">${acc.robux}</strong></span>
                                    <span>📥 Masuk: <strong class="text-sky-400">+${acc.totalIncoming}</strong></span>
                                    <span>📤 Keluar (Spend): <strong class="text-rose-400">-${acc.totalSpent}</strong></span>
                                    <span>📅 Dibuat: ${acc.createdDate}</span>
                                </div>
                            </div>
                        </div>
                        <button onclick="navigator.clipboard.writeText('${acc.cookie}'); alert('Cookie berhasil disalin!');" class="w-full md:w-auto bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-4 py-2 rounded border border-slate-600 transition text-center">
                            Salin Cookie
                        </button>
                    </div>

                    <!-- Riwayat Transaksi / Pembelian Game & Item -->
                    <div class="pt-3 border-t border-slate-800">
                        <div class="text-xs font-semibold text-slate-400 mb-2">📜 Riwayat Transaksi Robux Terakhir (In/Out/Spend):</div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2 max-h-36 overflow-y-auto">${txHtml}</div>
                    </div>
                </div>
            `;
            }).join('');
        }

        async function fetchAvatar(imgElement, userId) {
            try {
                const res = await fetch(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=Png&isCircular=true`);
                const data = await res.json();
                if (data.data && data.data[0] && data.data[0].imageUrl) {
                    imgElement.src = data.data[0].imageUrl;
                }
            } catch (e) {}
        }

        function filterResults() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allResults.filter(acc => acc.username.toLowerCase().includes(keyword));
            renderResults(filtered);
        }
    </script>
</body>
</html>l>
