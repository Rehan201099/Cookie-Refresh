<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Account Inspector</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl mt-6">
        <h1 class="text-2xl font-bold text-indigo-400 mb-2">Roblox Account Inspector</h1>
        <p class="text-sm text-slate-400 mb-4">Cek info detail akun: Mail, 2FA, Age, Premium, hingga Robux In/Out.</p>

        <div class="mb-4">
            <label class="block text-sm font-medium mb-2">Masukkan 1 Cookie (.ROBLOSECURITY):</label>
            <textarea id="cookieInput" rows="4" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-xs text-slate-200 focus:outline-none focus:border-indigo-500" placeholder="Paste cookie disini..."></textarea>
        </div>

        <button id="checkBtn" onclick="checkAccount()" class="w-full bg-indigo-600 hover:bg-indigo-500 font-semibold py-3 rounded-lg transition duration-200 shadow-md">
            Cek Akun Sekarang
        </button>

        <div id="statusText" class="mt-3 text-sm text-center text-slate-400"></div>
    </div>

    <div id="resultContainer" class="w-full max-w-md mt-6 space-y-4">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center text-slate-500 text-sm">
            Belum ada akun yang diperiksa.
        </div>
    </div>

    <script>
        async function checkAccount() {
            const cookieInput = document.getElementById('cookieInput');
            const btn = document.getElementById('checkBtn');
            const statusText = document.getElementById('statusText');
            const resultContainer = document.getElementById('resultContainer');

            const cookie = cookieInput.value.trim();
            if (!cookie) {
                statusText.className = "text-sm text-rose-400 font-semibold";
                statusText.innerText = "Error: Cookie tidak boleh kosong!";
                return;
            }

            btn.disabled = true;
            btn.classList.add('opacity-50');
            statusText.className = "text-sm text-amber-400";
            statusText.innerText = "Memeriksa akun...";

            try {
                const response = await fetch('/api/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cookie }) 
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Terjadi kesalahan');

                renderResult(data.results || []);
                statusText.className = "text-sm text-emerald-400 font-semibold";
                statusText.innerText = "Pemeriksaan selesai!";
            } catch (err) {
                statusText.className = "text-sm text-rose-400 font-semibold";
                statusText.innerText = `Error: ${err.message}`;
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }

        function renderResult(results) {
            const container = document.getElementById('resultContainer');
            if (!results.length) return;

            container.innerHTML = results.map(acc => `
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg space-y-3 text-sm">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                        <span class="font-bold text-indigo-300">${acc.displayName}</span>
                        <span class="text-xs text-slate-400">@${acc.username}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-slate-300">
                        <div>💰 Robux: <b class="text-emerald-400">${acc.robux}</b></div>
                        <div>🛡️ 2FA: <span class="${acc.has2FA.includes('Aktif') ? 'text-emerald-400' : 'text-rose-400'}">${acc.has2FA}</span></div>
                        <div>📧 Email: <span class="text-slate-200">${acc.emailStatus}</span></div>
                        <div>🆔 ID: <span class="text-slate-400">${acc.userId}</span></div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
